name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Sürüm etiketleri (örn: v1.0.0) için tetiklenir
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Manuel tetikleme için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone adair-flutter-lib dependency
      run: |
        git clone https://github.com/cohenadair/adair-flutter-lib.git ../adair-flutter-lib

    - name: Create dummy sensitive.properties
      run: |
        cat > mobile/assets/sensitive.properties << PROPS
        clientSender.email=dummy@example.com
        revenueCat.googleApiKey=dummy
        revenueCat.appleApiKey=dummy
        support.email=dummy@example.com
        mailjet.apiKey=dummy
        mailjet.secretKey=dummy
        visualCrossing.apiKey=dummy
        worldTides.apiKey=dummy
        firebase.secret=dummy
        PROPS

    - name: Setup signing keystore (if secrets exist)
      if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/anglers-log-release.keystore
        cat > mobile/android/keystore.properties << PROPS
        storeFile=anglers-log-release.keystore
        storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
        keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
        keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
        PROPS

    - name: Setup signing keystore (debug mode if no secrets)
      if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
      run: |
        echo "storeFile=" > mobile/android/keystore.properties
        echo "Note: Building unsigned debug APK"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get
      working-directory: ./mobile

    - name: Analyze project source
      run: flutter analyze
      working-directory: ./mobile

    - name: Run tests (Optional)
      run: flutter test || true
      working-directory: ./mobile

    - name: Build Release APK
      run: flutter build apk --release
      working-directory: ./mobile

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: anglers-log-apk-${{ github.sha }}
        path: mobile/build/app/outputs/flutter-apk/app-release.apk

    - name: Create Release (Only on tags)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: mobile/build/app/outputs/flutter-apk/app-release.apk
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
