name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone adair-flutter-lib dependency
        run: |
          git clone https://github.com/cohenadair/adair-flutter-lib.git ../adair-flutter-lib

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release --enable-experiment=dot-shorthands

      - uses: actions/upload-artifact@v4
        with:
          name: anglers-log-pro-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
