name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone adair-flutter-lib dependency
        run: |
          git clone https://github.com/cohenadair/adair-flutter-lib.git ../adair-flutter-lib

      - name: Patch adair-flutter-lib for offline/local builds
        run: |
          chmod +x scripts/patch-adair-lib.sh
          ./scripts/patch-adair-lib.sh

      - name: Create dummy sensitive.properties
        run: |
          cat > mobile/assets/sensitive.properties <<EOF
          visualCrossing.apiKey=unused
          mapbox.apiKey=unused
          worldTides.apiKey=unused
          firebase.secret=unused
          clientSender.email=unused@example.com
          revenueCat.googleApiKey=unused
          revenueCat.appleApiKey=unused
          support.email=unused@example.com
          sendGrid.apikey=unused
          EOF
          sed -i 's/^[[:space:]]*//' mobile/assets/sensitive.properties

      - name: Setup signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_STORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > mobile/android/app/anglers-log-release.keystore
            cat > mobile/android/keystore.properties <<PROPS
          storeFile=anglers-log-release.keystore
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          PROPS
            sed -i 's/^[[:space:]]*//' mobile/android/keystore.properties
            echo "Using release keystore from secrets."
          else
            echo "Signing secrets missing; release APK will use debug signing."
            rm -f mobile/android/keystore.properties
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: anglers-log-pro-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
